# Netlify Configuration for NoteSheet
#
# IMPORTANT: Environment Variables Setup
# ========================================
# To deploy this app successfully, you MUST set the following environment
# variables in your Netlify dashboard (Site settings > Environment variables):
#
# Required Firebase Configuration Variables:
# - VITE_FIREBASE_API_KEY
# - VITE_FIREBASE_AUTH_DOMAIN
# - VITE_FIREBASE_PROJECT_ID
# - VITE_FIREBASE_STORAGE_BUCKET
# - VITE_FIREBASE_MESSAGING_SENDER_ID
# - VITE_FIREBASE_APP_ID
# - VITE_FIREBASE_MEASUREMENT_ID
#
# You can find these values in your .env file (DO NOT commit .env to git!)
# or in your Firebase Console (Project Settings > General > Your apps)
#
# How to add environment variables in Netlify:
# 1. Go to: https://app.netlify.com/sites/[your-site]/settings/deploys#environment
# 2. Click "Add a variable" or "Edit variables"
# 3. Add each variable name and its corresponding value
# 4. Click "Save" and trigger a new deploy

# Build desde la RAIZ del monorepo, no desde apps/web.
#
# Con `base = "apps/web"` Netlify solo disparaba un build cuando cambiaba algo
# bajo esa carpeta, asi que un cambio en el package-lock.json de la raiz (por
# ejemplo, una actualizacion de seguridad) no llegaba nunca a produccion.
# Peor aun: al instalar dentro de apps/web, que no tiene lockfile propio,
# npm resolvia versiones frescas en cada build y el lockfile no gobernaba
# nada. Los deploys no eran reproducibles.
#
# Ahora Netlify instala desde la raiz con `npm ci` contra package-lock.json
# y construye el workspace `web`.
[build]
  publish = "apps/web/dist"
  command = "npm run build --workspace=web"

[build.environment]
  NODE_VERSION = "22"

# Un archivo de /assets que no existe tiene que dar 404, no index.html.
#
# Esta regla va ANTES de la del SPA, porque se aplican en orden y los archivos
# que sí existen se sirven igual (Netlify da prioridad al fichero estático
# sobre la redirección).
#
# Sin esto, pedir un trozo de JavaScript de una compilación anterior --lo que
# hace el navegador de quien tenía la app abierta cuando se despliega-- caía
# en la regla de abajo y devolvía HTML con estado 200. El navegador se
# encontraba `text/html` donde esperaba un módulo y soltaba un error sobre
# tipos MIME que no señala a ninguna parte. Con un 404 el fallo se entiende, y
# `lazyConRecarga` lo convierte en una recarga.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# SPA redirect - all routes go to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200